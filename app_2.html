<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
</head>
<body>
     <div class="container">
        <!-- Pantalla 1: Login -->
        <div class="screen active" id="screen1">
            <h1>Accesibilidad</h1>
            <p>Movilidad accesible para todos en silla de ruedas bici o a pie </p>
            <div class="input-group">
                <label>Usuario o correo electrónico</label>
                <input type="text" placeholder="Usuario o correo electrónico">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" placeholder="Contraseña">
            </div>
             <button class="btn-primary" id="loginBtn">Iniciar sesión</button>
            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            <button class="btn-secondary" id="createAccountBtn">Crear cuenta</button>
            <div class="accessibility-options">
           
         </div>

         <!-- Pantalla 2: Preferences -->
        <div class="screen" id="screen2">
            <a href="#" class="back-btn" id="backBtn">←</a>
            <h1>¿Cómo te mueves normalmente?</h1>
            <div class="options-grid">
                <button class="option-btn">Silla de ruedas</button>
                <button class="option-btn">Bicicleta</button>
                <button class="option-btn">Peatón</button>

         <!-- Pantalla 3: Map -->
        
        <div class="container">
           <h1>ACCESIBILIDAD</h1>
           <h2>¿A dónde vas?</h2>

           </div>
            <div class="map-placeholder">
                <!-- Placeholder for map -->
                <div class="map-overlay">Mapa</div>
            </div>
              <div class="menu-buttons">
      <button class="menu-btn" onclick="alert('Buscando ruta accesible...')">
         Ruta accesible
      </button>
      <button class="menu-btn" onclick="alert('Reportar obstáculo activado')">
        Reportar obstáculo
      </button>
      <button class="menu-btn" onclick="goToCalidad()">
         Ver calidad del aire
      </button>
    </div>
</body>
</html>
