<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/normalize.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <title>Login - Accesibilidad</title>
  </head>
  <body>
    <div class="container">
      <h1>Accesibilidad</h1>
      <p>Movilidad accesible para todos en silla de ruedas bici o a pie </p>

      <div class="input-group">
        <label for="user">Usuario o correo electrónico</label>
        <input id="user" type="text" placeholder="Usuario o correo electrónico" />
      </div>

      <div class="input-group">
        <label for="pass">Contraseña</label>
        <input id="pass" type="password" placeholder="Contraseña" />
      </div>

      <button class="btn-primary" id="loginBtn">Iniciar sesión</button>
      <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      <a class="btn-secondary" href="preferences.html" id="createAccountBtn">Crear cuenta / Preferencias</a>

      <footer style="margin-top:18px;"><a href="../app_2.html">Volver a la entrada</a></footer>
    </div>
  </body>
</html>
