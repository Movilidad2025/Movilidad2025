<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta Accesible - Accesibilidad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="fin-recorrido.css">
    <link rel="stylesheet" href="../app_unificada/assets/css/common.css">
</head>
<body>
    <!-- Contenedor principal -->
    <div class="center-wrapper">
        <!-- Barra superior -->
        <div class="top-bar">
            <div class="top-bar-content">
                <!-- Iconos a la izquierda -->
                <div class="left-icons">
                    <button class="icon-btn" id="dark-mode-btn" aria-label="Modo oscuro">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="icon-btn" id="text-size-btn" aria-label="Tamaño de texto">
                        <i class="fas fa-text-height"></i>
                    </button>
                </div>
                
                <!-- Hora central -->
                <div class="time" id="current-time">18:22</div>
                
                <!-- Iconos a la derecha -->
                <div class="right-icons">
                    <button class="icon-btn" id="language-btn" aria-label="Idioma">
                        <i class="fas fa-globe"></i>
                    </button>
                    <button class="icon-btn" id="sound-btn" aria-label="Sonido">
                        <i class="fas fa-volume-up"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Contenido principal -->
        <div class="route-container">
            <h1 class="title">Ruta accesible</h1>
            <p class="subtitle">Resumen del recorrido y disponibilidad de servicios</p>
            
            <!-- Mapa representativo -->
            <div class="map-container">
                <div class="map-route"></div>
                <div class="map-placeholder">
                    <i class="fas fa-map-marked-alt"></i>
                    <p>Vista previa de la ruta accesible</p>
                </div>
            </div>
            
            <!-- Botón para confirmar la ruta seleccionada -->
            <button class="confirm-button" id="confirm-route-btn">Confirmar ruta</button>
            
            <!-- Preferencias de ruta -->
            <div class="preferences-section">
                <h2 class="section-title">Preferencias de ruta</h2>
                
                <div class="preference-list">
                    <!-- Preferencia: Rampas accesibles -->
                    <div class="preference-item">
                        <div class="preference-icon">
                            <i class="fas fa-wheelchair"></i>
                        </div>
                        <div class="preference-text">
                            <span class="percentage">65%</span> Rampas accesibles
                        </div>
                    </div>
                    
                    <!-- Preferencia: Cruces con semáforo -->
                    <div class="preference-item">
                        <div class="preference-icon">
                            <i class="fas fa-traffic-light"></i>
                        </div>
                        <div class="preference-text">
                            Cruces con semáforo
                        </div>
                    </div>
                    
                    <!-- Preferencia: Sin escaleras -->
                    <div class="preference-item">
                        <div class="preference-icon">
                            <i class="fas fa-stairs"></i>
                        </div>
                        <div class="preference-text">
                            Sin escaleras
                        </div>
                    </div>
                    
                    <!-- Preferencia: Calidad del aire -->
                    <div class="preference-item">
                        <div class="preference-icon">
                            <i class="fas fa-wind"></i>
                        </div>
                        <div class="preference-text">
                            Buena Calidad del aire
                        </div>
                    </div>
                    
                    <!-- Sub-preferencia: Alumbrado funcionando -->
                    <div class="preference-item nested-item">
                        <div class="preference-icon">
                            <i class="fas fa-lightbulb"></i>
                        </div>
                        <div class="preference-text">
                            <span class="percentage">78%</span> Alumbrado funcionando
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../app_unificada/assets/js/common.js"></script>
    <script src="fin-recorrido.js"></script>
</body>
</html>
